<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17233b"><title>Mind Reader</title><link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="./styles.css"></head><body><main class="app"><header><div><h1>🧠 Mind Reader</h1><small>v0.2.1 • <span id="network">Ready</span></small></div><button id="settingsBtn" aria-label="Settings">⚙️</button></header><section id="home" class="panel"><h2>Think of something...</h2><p>I'll try to guess it in 20 questions. You can keep going to 30.</p><button id="quick">Quick Play • Anything</button><label for="category">Or choose a category</label><select id="category"><option value="people">Real people</option><option value="characters">Fictional characters</option><option value="animals">Animals</option><option value="places">Places</option><option value="objects">Objects</option></select><button id="categoryPlay" class="secondary">Category Play</button><p class="muted">Early prototype: a small starter knowledge set. More answers and guided learning are planned.</p></section><section id="game" class="panel hidden"><div class="progress"><span id="count"></span><span id="mode"></span></div><div class="meter"><div id="fill"></div></div><h2 id="question"></h2><div id="answers" class="answers"></div><details class="history"><summary>Question history</summary><ol id="history"></ol></details><div class="toolbar"><button id="undo" class="secondary">← Undo</button><button id="restart" class="secondary">Restart</button></div></section><section id="result" class="panel hidden"><h2 id="resultTitle"></h2><p id="resultText"></p><div id="resultActions"></div><button id="newGame" class="secondary">New game</button></section><section id="settings" class="panel hidden"><h2>Settings & statistics</h2><p id="stats"></p><button id="export" class="secondary">Export data</button><label class="import">Import data <input id="import" type="file" accept="application/json"></label><button id="clear" class="danger">Clear local statistics</button><button id="back" class="secondary">Back</button></section></main><script type="module" src="./js/app.js"></script></body></html>
